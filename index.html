<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イコノイジョイ 好き顔9選｜試作</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff7fb;color:#302b31}
button{font:inherit}
#app{max-width:760px;margin:auto;padding:24px 16px 40px}
.screen{text-align:center}
h1{font-size:28px;margin:12px 0 8px}
h2{font-size:22px;margin:10px 0}
.sub{color:#7b7079;font-size:14px;line-height:1.7}
.progress{height:6px;background:#eadfe6;border-radius:99px;margin:20px 0}
.progress>div{height:100%;background:#e86b9a;border-radius:99px;transition:.25s}
.question{font-weight:700;font-size:18px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{border:2px solid #eee4ea;background:white;border-radius:18px;padding:10px;cursor:pointer;min-width:0;transition:.15s}
.card.selected{border-color:#e86b9a;background:#fff0f6;transform:translateY(-2px)}
.photo{aspect-ratio:1/1;background:linear-gradient(135deg,#f2e8ef,#e7dce4);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#8e7885}
.group{font-size:11px;color:#9a8994;margin-top:9px}
.name{font-size:15px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px}
.btn{border:0;border-radius:999px;padding:13px 22px;background:#e86b9a;color:#fff;font-weight:700;cursor:pointer}
.btn.secondary{background:#eee6eb;color:#594f57}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rank{background:#fff;border-radius:16px;padding:9px;border:1px solid #eee4ea}
.rank:nth-child(1){grid-column:span 3}
.rank .photo{aspect-ratio:1.25/1}
.badge{font-weight:800;color:#e05d8d;margin:5px}
.note{margin-top:18px;background:#fff;border-radius:14px;padding:12px;color:#776c75;font-size:12px;line-height:1.6}
@media(max-width:430px){h1{font-size:25px}.grid{gap:8px}.card{padding:7px}.name{font-size:13px}.result-grid{gap:7px}}
</style>
</head>
<body>
<main id="app">
<section id="intro" class="screen">
  <div style="font-size:48px">♡</div>
  <h1>イコノイジョイ<br>好き顔9選</h1>
  <p class="sub">=LOVE・≠ME・≒JOYの33人から<br>あなたの「好きな顔」TOP9を選びます。</p>
  <p class="sub">まずは気になる顔を選んで、その後は1対1で比較していきます。</p>
  <button id="start" class="btn">診断スタート</button>
</section>

<section id="quiz" class="hidden">
  <div class="sub" id="phase"></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="question" id="question"></div>
  <div id="choices" class="grid"></div>
  <div class="actions">
    <button id="next" class="btn" disabled>次へ</button>
  </div>
</section>

<section id="result" class="screen hidden">
  <div style="font-size:42px">♡</div>
  <h1>あなたの好き顔TOP9</h1>
  <p class="sub">イコノイジョイ33人から選ばれた9人です。</p>
  <div id="results" class="result-grid"></div>
  <div class="note">※現在はアルゴリズム確認用の試作版です。写真・文言・結果画面は後から変更できます。</div>
  <div class="actions"><button id="again" class="btn secondary">もう一度やる</button></div>
</section>
</main>

<script>
const members = [
["=LOVE","大谷 映美里"],["=LOVE","大場 花菜"],["=LOVE","音嶋 莉沙"],["=LOVE","齋藤 樹愛羅"],["=LOVE","佐々木 舞香"],["=LOVE","髙松 瞳"],["=LOVE","瀧脇 笙古"],["=LOVE","野口 衣織"],["=LOVE","諸橋 沙夏"],["=LOVE","山本 杏奈"],
["≠ME","尾木 波菜"],["≠ME","落合 希来里"],["≠ME","蟹沢 萌子"],["≠ME","河口 夏音"],["≠ME","川中子 奈月心"],["≠ME","櫻井 もも"],["≠ME","鈴木 瞳美"],["≠ME","谷崎 早耶"],["≠ME","冨田 菜々風"],["≠ME","永田 詩央里"],["≠ME","本田 珠由記"],
["≒JOY","逢田 珠里依"],["≒JOY","天野 香乃愛"],["≒JOY","市原 愛弓"],["≒JOY","江角 怜音"],["≒JOY","大信田 美月"],["≒JOY","大西 葵"],["≒JOY","小澤 愛実"],["≒JOY","髙橋 舞"],["≒JOY","藤沢 莉子"],["≒JOY","村山 結香"],["≒JOY","山田 杏佳"],["≒JOY","山野 愛月"]
].map((x,i)=>({id:i,group:x[0],name:x[1]}));

let state;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function reset(){
 state={phase:"screen",q:0,screening:[],pairings:[],scores:members.map(()=>0),wins:members.map(()=>0),selected:new Set()};
}
function start(){
 reset();
 // 9 screening questions = 36 slots, arranged so all 33 appear at least once.
 const order=shuffle([...members.keys()]);
 state.screening=[];
 for(let i=0;i<9;i++) state.screening.push(order.slice(i*4,i*4+4));
 state.phase="screen"; state.q=0;
 $("intro").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
 render();
}
function render(){
 const total=state.screening.length + 12;
 const current=state.q;
 $("bar").style.width=((current/total)*100)+"%";
 if(state.phase==="screen"){
   $("phase").textContent=`STEP 1｜気になる顔を選ぶ　${current+1} / ${state.screening.length}`;
   $("question").textContent="この中で、気になる顔を最大3人選んでね♡";
   const ids=state.screening[current];
   state.selected=new Set();
   drawCards(ids,true);
 }else{
   $("phase").textContent=`STEP 2｜1対1で比較　${current-state.screening.length+1} / 12`;
   $("question").textContent="どちらの顔がより好き？";
   const pair=state.pairings[current-state.screening.length];
   state.selected=new Set();
   drawCards(pair,false);
 }
 $("next").disabled=true;
}
function drawCards(ids,multi){
 const wrap=$("choices"); wrap.innerHTML="";
 ids.forEach(id=>{
   const m=members[id], b=document.createElement("button");
   b.type="button"; b.className="card";
   b.innerHTML=`<div class="photo">${m.name.slice(0,1)}</div><div class="group">${m.group}</div><div class="name">${m.name}</div>`;
   b.addEventListener("click",()=>{
     if(multi){
       if(state.selected.has(id)) state.selected.delete(id);
       else if(state.selected.size<3) state.selected.add(id);
     }else{
       state.selected=new Set([id]);
     }
     [...wrap.children].forEach((el,i)=>el.classList.toggle("selected",state.selected.has(ids[i])));
     $("next").disabled=state.selected.size===0;
   });
   wrap.appendChild(b);
 });
}
function makePairings(){
 const candidates=[...members.keys()].sort((a,b)=>state.scores[b]-state.scores[a]).slice(0,14);
 const pairs=[];
 const used=new Set();
 // First compare candidates around the likely TOP9 cutoff.
 while(pairs.length<12){
   let best=null, gap=Infinity;
   for(let i=0;i<candidates.length;i++) for(let j=i+1;j<candidates.length;j++){
     const a=candidates[i],b=candidates[j], key=a<b?`${a}-${b}`:`${b}-${a}`;
     if(used.has(key)) continue;
     const g=Math.abs(state.scores[a]-state.scores[b]);
     if(g<gap){gap=g;best=[a,b,key];}
   }
   if(!best) break;
   pairs.push(best.slice(0,2)); used.add(best[2]);
   // Encourage coverage by making scores temporarily less useful for selection.
   if(pairs.length===6){
     const shuffled=shuffle(candidates);
     for(let i=0;i<shuffled.length-1 && pairs.length<12;i+=2){
       const a=shuffled[i],b=shuffled[i+1],key=a<b?`${a}-${b}`:`${b}-${a}`;
       if(!used.has(key)){pairs.push([a,b]);used.add(key);}
     }
   }
 }
 state.pairings=pairs;
}
function next(){
 if(state.phase==="screen"){
   state.selected.forEach(id=>state.scores[id]+=2);
   state.q++;
   if(state.q>=state.screening.length){
     makePairings(); state.phase="pair";
   }
 }else{
   const pair=state.pairings[state.q-state.screening.length];
   const winner=[...state.selected][0];
   const loser=pair.find(x=>x!==winner);
   state.scores[winner]+=3; state.scores[loser]+=0; state.wins[winner]++;
   state.q++;
   if(state.q>=state.screening.length+state.pairings.length){showResult();return;}
 }
 render();
}
function showResult(){
 $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
 const top=[...members.keys()].sort((a,b)=>state.scores[b]-state.scores[a]).slice(0,9);
 $("results").innerHTML="";
 top.forEach((id,i)=>{
   const m=members[id], d=document.createElement("div");
   d.className="rank";
   d.innerHTML=`<div class="badge">${i+1}位</div><div class="photo">${m.name.slice(0,1)}</div><div class="group">${m.group}</div><div class="name">${m.name}</div>`;
   $("results").appendChild(d);
 });
}
$("start").addEventListener("click",start);
$("next").addEventListener("click",next);
$("again").addEventListener("click",start);
reset();
</script>
</body>
</html>
